# Run A2: identical to A1 except for one controlled augmentation bundle
# (small gain change, one masked band per axis, small shift).
run_name: a2_scratch_cnn_aug
seed: 42
output_dir: runs
data:
  splits_csv: data/manifest/splits.csv
  image_dir: data/selected
  size: 224
  train_snr: [10, 12, 14, 16, 18, 20]
  eval_snr: [10, 12, 14, 16, 18, 20]
  require_files: true
model:
  name: scratch_cnn
  widths: [32, 64, 128, 256]
  dropout: 0.3
train:
  batch_size: 32
  epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  scheduler: cosine
augment:
  gain: 0.05
  mask_x: 24
  mask_y: 24
  shift: 8
