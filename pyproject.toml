[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-rf"
version = "0.1.0"
description = "Binary classification of drone RF spectrograms (scratch CNN vs pretrained ResNet18)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "torch>=2.6",
    "torchvision>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs network, real data or pretrained weights (run with -m integration)"]

[tool.ruff]
line-length = 125
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
